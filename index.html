<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>單字卡片盒</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Gentium+Book+Plus:ital@0;1&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: one narrow column like a card file drawer; the ruled index card is the hero, tabs pinned to the bottom for thumbs */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#1b2338; --muted:#5d6681; --line:#d5dbe8;
  --rule:#c9d6ee; --margin:#e0525b; --accent:#2f54d6; --accent-ink:#ffffff;
  --good:#1f8a5b; --warn:#c7811c; --bad:#cf3f4a; --chip:#e2e7f2;
  --f-display:"Bricolage Grotesque", "Noto Sans TC", system-ui, sans-serif;
  --f-body:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
  --f-phon:"Gentium Book Plus", "Charis SIL", "Doulos SIL", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141d; --surface:#1b2030; --ink:#e8ecf6; --muted:#9aa3bd; --line:#2c3347;
  --rule:#27304a; --margin:#e86a72; --accent:#7f9bff; --accent-ink:#0e1220;
  --good:#3fae7c; --warn:#d3943a; --bad:#e05b66; --chip:#252c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141d; --surface:#1b2030; --ink:#e8ecf6; --muted:#9aa3bd; --line:#2c3347;
  --rule:#27304a; --margin:#e86a72; --accent:#7f9bff; --accent-ink:#0e1220;
  --good:#3fae7c; --warn:#d3943a; --bad:#e05b66; --chip:#252c40; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 104px;display:flex;flex-direction:column;gap:18px}
.wrap.nonav{padding-block:28px 40px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.sub{font-size:13px;color:var(--muted);margin:0}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:4px 12px 4px 4px;font:500 14px var(--f-body);cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:none}
button,input,select,textarea{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:500 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.small button{font-size:13px;padding:5px 11px}
.panel{background:var(--surface);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px}
.btn{border:0;border-radius:10px;padding:12px 20px;font:700 15px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 > *{flex:1 1 140px}
.note{font-size:12px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea,.input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:15px;width:100%;box-sizing:border-box}
.field textarea{min-height:110px;resize:vertical;font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:1em}

/* login */
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ucard{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.ucard .av{width:42px;height:42px;font-size:18px}
.ucard b{font-size:17px}
.ucard span{font-size:12px;color:var(--muted)}
.ucard.add{border-style:dashed;justify-content:center;align-items:center;color:var(--muted);min-height:118px}
.ucard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* home */
.today{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--chip) 0)}
.ring > div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.ring small{font-size:11px;color:var(--muted)}
.facts{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.facts div b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}
.facts div span{font-size:12px;color:var(--muted)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.cats{grid-template-columns:1fr}}
.cat{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.cat b{font-size:16px}
.cat span{font-size:12px;color:var(--muted)}
.cat.mine{border-color:var(--accent)}
.bar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.cat .num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
details.set summary{cursor:pointer;font-weight:700}
details.set[open] summary{margin-bottom:12px}
.setgrid{display:grid;gap:12px}

/* index card */
.card{position:relative;background:var(--surface);border-radius:6px;min-height:300px;cursor:pointer;
  box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,60,.45);
  background-image:linear-gradient(var(--surface) 62px,transparent 62px),
    repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);
  padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px;user-select:none}
.card::before{content:"";position:absolute;left:0;right:0;top:62px;height:2px;background:var(--margin);opacity:.75}
.card-top{display:flex;justify-content:space-between;align-items:center;height:30px;font-size:12px;color:var(--muted);gap:8px}
.box-dots{display:flex;gap:4px}
.box-dots i{width:8px;height:8px;border-radius:50%;background:var(--chip)}
.box-dots i.on{background:var(--accent)}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1.15;margin-top:28px;word-break:break-word}
.phon{font-family:var(--f-phon);font-size:19px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.icon{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;width:34px;height:34px;
  display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.icon.on{color:var(--warn);border-color:var(--warn)}
.icon.on svg{fill:currentColor}
.back{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.zh{font-size:22px;font-weight:700;line-height:32px}
.pos{display:inline-block;font:italic 15px var(--f-phon);color:var(--margin);margin-right:8px}
.ex{font-family:var(--f-phon);font-style:italic;font-size:17px;line-height:32px}
.ex mark{background:none;color:var(--accent);font-weight:700;font-style:normal}
.exzh{font-size:14px;color:var(--muted);line-height:1.5;margin-top:-4px}
.forms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.flabel{font-size:12px;color:var(--muted);margin-right:2px}
.colloc{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:14px;line-height:1.5}
.colloc span:not(.flabel){font-family:var(--f-phon);font-size:16px}
.fchip{font:15px var(--f-phon);background:var(--chip);border-radius:6px;padding:1px 8px;line-height:1.6}
.daily{background:var(--ink);color:var(--bg);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px}
.daily .meta{color:inherit;opacity:.75}
.daily .den{font-family:var(--f-phon);font-size:20px;line-height:1.45}
.daily .den mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--margin);text-decoration-thickness:2px;text-underline-offset:3px}
.daily .dzh{font-size:14px;opacity:.85}
.daily .icon{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.dwords{display:grid;gap:6px}
.dword{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:8px;padding:8px 10px}
.dword b{font-family:var(--f-display);font-size:16px}
.dword span{font-size:13px;opacity:.85}
.dword button{border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font:500 12px var(--f-body);cursor:pointer;white-space:nowrap}
.daily a{color:inherit;font-size:12px;opacity:.75}
.linkbtn{background:none;border:0;color:inherit;opacity:.8;font:500 13px var(--f-body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.hint{margin-top:auto;font-size:13px;color:var(--muted);text-align:center;padding-top:16px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:0;border-radius:10px;padding:12px 6px;font:700 15px var(--f-body);cursor:pointer;color:#fff}
.rate .r0{background:var(--bad)} .rate .r1{background:var(--warn)} .rate .r2{background:var(--good)}
.rate button small{display:block;font-weight:400;font-size:11px;opacity:.9}
.progress{height:4px;background:var(--chip);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.empty{background:var(--surface);border-radius:8px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}

/* quiz */
.qcard{background:var(--surface);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.qword{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;word-break:break-word;min-width:0}
.qword.zhq{font-family:var(--f-body);font-size:24px}
.opts{display:grid;gap:10px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;
  padding:12px 14px;font:500 16px var(--f-body);cursor:pointer}
.opts button.en{font-family:var(--f-display);font-weight:600;font-size:18px}
.right{border-color:var(--good)!important;background:color-mix(in srgb,var(--good) 16%,var(--surface))!important}
.wrong{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 14%,var(--surface))!important}
.spell{font-family:var(--f-display);font-size:22px;letter-spacing:.02em}
.answer{font-size:15px}
.answer b{font-family:var(--f-display);font-size:20px}
.score{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* lists */
.list{background:var(--surface);border-radius:8px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .w{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:0;word-break:break-word}
.item .w span{font:15px var(--f-phon);color:var(--muted);margin-left:6px}
.item .z{grid-column:1;color:var(--muted);font-size:14px;min-width:0}
.item .z em{font-style:normal;color:var(--bad);margin-left:6px;font-size:12px}
.item .r{grid-row:1/3;grid-column:2;display:flex;align-items:center;gap:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;font-family:var(--f-body);font-weight:500;vertical-align:2px}
.item.tap{cursor:pointer}
.item .detail{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;padding-top:8px;margin-top:6px;border-top:1px dashed var(--line);min-width:0}
.item .detail .ex{line-height:1.5}
.item .more{font-size:11px;color:var(--accent);margin-left:6px;font-family:var(--f-body);font-weight:500}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 40px);text-align:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:500 12px var(--f-body);padding:6px 2px;border-radius:8px;cursor:pointer;display:grid;justify-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
@keyframes flipin{from{transform:rotateX(8deg);opacity:.6}to{transform:none;opacity:1}}
.card.flip{animation:flipin .22s ease-out}

/* ================= v3 視覺更新 ================= */
:root{--accent2:#7b5cff;--r:16px;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 10px 28px -16px rgba(20,30,60,.30)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent2:#b29bff;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--accent2:#b29bff;--shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.75)}
body{min-height:100vh;background:
  radial-gradient(900px 420px at 15% -160px,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%),
  radial-gradient(700px 380px at 100% -120px,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 70%),var(--bg);
  background-attachment:fixed}
.panel,.qcard,.list,.empty{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.cat,.ucard{border-radius:14px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.cat:active,.ucard:active,.btn:active,.opts button:active,.rate button:active{transform:scale(.97)}
.btn{border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  box-shadow:0 8px 18px -10px var(--accent);transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:none}
.chips button{transition:background .15s,color .15s}
.chips button[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.who{box-shadow:var(--shadow)}
h1{background:linear-gradient(120deg,var(--ink) 30%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring{background:conic-gradient(var(--accent),var(--accent2) calc(var(--p)*1%),var(--chip) 0)}
.today .btn{width:100%}
.bar i{background:linear-gradient(90deg,var(--good),color-mix(in srgb,var(--good) 60%,var(--accent)))}
.cat.mine{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.cat .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* 每日一句 */
.daily{background:linear-gradient(145deg,#1d2752 0%,#35307a 55%,#5b3a8c 100%);color:#f4f5ff;border-radius:20px;padding:20px;
  box-shadow:0 18px 40px -22px rgba(40,30,120,.8);position:relative;overflow:hidden}
.daily::after{content:"“";position:absolute;right:14px;top:-26px;font:160px/1 Georgia,serif;color:rgba(255,255,255,.07);pointer-events:none}
.daily .icon{border-color:rgba(255,255,255,.35);color:#fff}
.daily .den mark{text-decoration-color:#ff9aa2}
.dword{background:rgba(255,255,255,.09);border-radius:12px}
.dword button{border-color:rgba(255,255,255,.4)}
.dword button.done{background:rgba(255,255,255,.18);border-color:transparent}
.dactions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.arch{display:flex;flex-direction:column;gap:10px}
.arch .aitem{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.arch .aen{font-family:var(--f-phon);font-size:17px;line-height:1.45}
.arch .azh{font-size:13px;color:var(--muted)}

/* 學習紀錄熱力圖 */
.heatwrap{display:flex;flex-direction:column;gap:8px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--chip)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--chip))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--chip))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--chip))}
.heat i.l4{background:var(--accent2)}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;background:var(--chip)}
.legend i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--chip))}.legend i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--chip))}.legend i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--chip))}.legend i.l4{background:var(--accent2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:116px;margin-bottom:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.week b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:3px}
.week .zero b{background:var(--chip)}

/* 卡片：翻面 + 滑動 */
.stage{perspective:1100px}
.card{border-radius:18px;transition:transform .25s ease,box-shadow .2s;touch-action:pan-y}
.card.flipping{animation:flipY .38s cubic-bezier(.2,.7,.3,1)}
@keyframes flipY{0%{transform:rotateY(-80deg);opacity:.4}100%{transform:none;opacity:1}}
.card.drag{transition:none}
.swipe-tag{position:absolute;top:18px;padding:4px 12px;border-radius:999px;font:700 14px var(--f-body);color:#fff;opacity:0;pointer-events:none;z-index:2}
.swipe-tag.l{left:18px;background:var(--bad)} .swipe-tag.r{right:18px;background:var(--good)}
.swipehint{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.rate button{border-radius:14px}
.exrow{display:flex;gap:8px;align-items:flex-start}
.exrow .icon{width:28px;height:28px;margin-top:2px}

/* 開關 */
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--chip);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}

/* 漂浮底部導覽 */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  border-radius:22px;padding:6px;background:color-mix(in srgb,var(--surface) 86%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 32px -14px rgba(20,30,60,.45)}
nav.tabs .in{max-width:540px}
nav.tabs button{border-radius:16px;transition:background .15s,color .15s}

.wrap{padding-block:20px 120px}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheader{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheader span{font-size:12px;color:var(--muted)}

/* ================= v4 新聞專區 + 分級 ================= */

.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.nteasep{gap:6px}
.nrow{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font:500 14px var(--f-body)}

.ah{font-size:27px;line-height:1.2}
.azht{margin:-8px 0 0;color:var(--muted);font-size:15px}
.atools{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}

.aen{font:19px/1.65 var(--f-phon)}
.tw{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;border-radius:3px;text-decoration:underline dotted color-mix(in srgb,var(--muted) 45%,transparent);text-underline-offset:4px}

.wsheet{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:40;max-width:480px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px -12px rgba(20,30,60,.45);padding:8px 10px 8px 12px;display:flex;flex-direction:column;gap:2px}

.kw{border:0;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font:inherit;font-weight:700;padding:0 3px;border-radius:4px;cursor:pointer}
.kwdemo{color:var(--accent);font-weight:700}
.arow{display:flex;gap:12px;align-items:center}
.arow .icon{width:28px;height:28px}.arow .icon svg{width:13px;height:13px}
.arow .linkbtn{color:var(--muted)}
.azh2{font-size:15px;color:var(--muted);border-left:3px solid var(--accent2);padding-left:10px;line-height:1.6}
.nvlist{display:flex;flex-direction:column}
.nv{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.nv:first-child{border-top:0}
.nvw{min-width:0}
.nvw b{font:700 18px var(--f-display)}
.nvw .ipa{font:15px var(--f-phon);color:var(--muted)}
.nvz{font-size:15px}
.nvr{display:flex;gap:6px;align-items:center;flex:none}
.addnb{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:5px 10px;font:500 12px var(--f-body);cursor:pointer;white-space:nowrap}
.addnb.done{background:var(--accent);color:#fff}
.legend2{display:flex;gap:6px;flex-wrap:wrap}
.lg{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent)}
.r-S{--rc:#2f6bd6}.r-V{--rc:#d23f4a}.r-O{--rc:#1f8a5b}.r-C{--rc:#c7811c}.r-M{--rc:#6b7590}.r-CL{--rc:#9a4fc4}.r-AP{--rc:#1f8fa3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .r-S{--rc:#7fa6ff}:root:not([data-theme="light"]) .r-V{--rc:#ff7b84}:root:not([data-theme="light"]) .r-O{--rc:#4fc48c}:root:not([data-theme="light"]) .r-C{--rc:#e9a94a}:root:not([data-theme="light"]) .r-M{--rc:#a3abc4}:root:not([data-theme="light"]) .r-CL{--rc:#c79bff}:root:not([data-theme="light"]) .r-AP{--rc:#5fcfe0}}
.sbox{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.sn{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.sn .icon{width:28px;height:28px}.sn .icon svg{width:13px;height:13px}
.sent{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:flex-start}
.chunk{display:inline-flex;flex-direction:column;gap:2px;max-width:100%}
.ct{font:17px/1.45 var(--f-phon);border-bottom:3px solid var(--rc);padding:0 2px 2px;background:color-mix(in srgb,var(--rc) 7%,transparent);border-radius:4px 4px 0 0}
.cl{font-size:11px;font-weight:700;color:var(--rc);padding-left:2px}
.szh{font-size:14px;color:var(--muted)}
.snote{font-size:14px;line-height:1.6;background:var(--bg);border-radius:10px;padding:10px 12px}
.snote b{display:block;font-size:12px;color:var(--accent);margin-bottom:2px}
.nq{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.nqq{font-weight:700;font-size:15px}
.nq .opts button{font-size:15px;padding:10px 12px}
.nqex{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.nscore{font-size:15px}.nscore b{font:800 28px var(--f-display);color:var(--accent)}
.nsrc{font-size:13px;color:var(--muted);text-align:center}
/* ================= v5 字體大小（給長輩看得更清楚） ================= */
.fsrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
.fsrow .chips{flex:none}
html.fs-l body{font-size:17px}

/* ================= v6 復原上一張 + 備份提醒 ================= */
.undo{color:var(--muted);opacity:1;align-self:center;font-size:14px;padding:6px 10px}
.bkwarn{border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}

html.fs-xl .undo,html.fs-xl .bkwarn p{font-size:18px}
/* ================= v7 重測答錯 + 拼字提示 ================= */
.hintw{font:700 22px var(--f-display);letter-spacing:.12em;color:var(--muted);overflow-wrap:anywhere;text-align:center}
.qretry{font-size:12px;color:var(--accent);font-weight:700}
html.fs-xl .hintw{font-size:26px}
/* ================= v8 翻卡方向 + 今天學過的字 ================= */
.word.zhw{font-family:var(--f-body);font-size:clamp(26px,7.4vw,34px);line-height:1.35;font-weight:700}

details.tdlist .list{background:var(--bg)}
/* ================= v9 新字「我早就會了」+ 複習預告 ================= */
.linkbtn.knew{color:var(--muted);opacity:1;align-self:center;font-size:14px;padding:6px 10px;text-align:center}
.fcast{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}

html.fs-l .knew{font-size:16px}html.fs-xl .knew{font-size:18px}
/* ================= v10 常錯的字 + 答錯時看「你選的字」 ================= */
.picked{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bad) 8%,var(--bg));border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}

/* ================= v11 例句裡的字可以點 + 今天再多學幾個新字 ================= */
.ex .tw{font-style:inherit;text-underline-offset:3px}
.ex .tw.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.morenew{display:flex;flex-direction:column;gap:6px;align-items:center}

html.fs-l .tapnote{font-size:14px}html.fs-xl .tapnote{font-size:15px}
/* ================= v12 慢速發音按鈕 + 筆記本一次移出已熟記 ================= */
.icon.slowb{font:700 13px var(--f-body);width:34px}
.nbclean{align-self:flex-start}
html.fs-l .icon.slowb{font-size:14px}html.fs-xl .icon.slowb{font-size:15px}
/* ================= v13 新視覺：原子筆藍 + 螢光筆黃的「文具」風格（只改外觀） ================= */
:root{--bg:#eceef2;--surface:#fffefb;--ink:#141c3a;--muted:#59617c;--line:#cfd4e2;--chip:#e4e7f0;
  --accent:#2440d8;--accent2:#2440d8;--accent-ink:#fff;--hl:#ffe24a;--pink:#ff7aa8;--note:#fff2a8;--note-ink:#141c3a;
  --edge:#141c3a;--hard:4px 4px 0 var(--edge);--shadow:0 1px 0 color-mix(in srgb,var(--edge) 10%,transparent);--r:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f121c;--surface:#191e2e;--ink:#eef0f8;--muted:#a0a8c2;--line:#2c3350;--chip:#252c44;
  --accent:#92a4ff;--accent2:#92a4ff;--accent-ink:#0f121c;--hl:#e9c62f;--pink:#ff8fb4;--note:#3d3712;--note-ink:#fdf5c4;--edge:#05070d;
  --shadow:0 1px 0 rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0f121c;--surface:#191e2e;--ink:#eef0f8;--muted:#a0a8c2;--line:#2c3350;--chip:#252c44;
  --accent:#92a4ff;--accent2:#92a4ff;--accent-ink:#0f121c;--hl:#e9c62f;--pink:#ff8fb4;--note:#3d3712;--note-ink:#fdf5c4;--edge:#05070d;--shadow:0 1px 0 rgba(0,0,0,.5)}
body{background:radial-gradient(circle,color-mix(in srgb,var(--ink) 13%,transparent) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg);background-attachment:fixed}
.wrap{padding-block:22px 148px}
h1{font-family:var(--f-display),"Noto Serif TC",serif;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);font-size:32px;letter-spacing:-.02em;
  display:inline;background-image:linear-gradient(transparent 64%,var(--hl) 64% 94%,transparent 94%);padding:0 4px;margin-left:-4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h1{background-image:linear-gradient(transparent 86%,var(--hl) 86% 96%,transparent 96%)}}
:root[data-theme="dark"] h1{background-image:linear-gradient(transparent 86%,var(--hl) 86% 96%,transparent 96%)}
header.top .sub{margin-top:6px}
h2{font-size:19px;letter-spacing:-.01em}
.panel,.qcard,.list,.empty,.art,.arch .aitem{border:1.5px solid var(--line);box-shadow:none;border-radius:var(--r)}
.cat,.ucard,.lvc,.ncard{border:1.5px solid var(--line);box-shadow:none;border-radius:14px;transition:transform .12s ease,border-color .12s,box-shadow .12s}
.cat:hover,.lvc:hover,.ncard:hover{border-color:var(--ink)}
.cat:active,.lvc:active,.ncard:active,.ucard:active{transform:translate(2px,2px) scale(1)}
.cat.mine,.lvc.mine{border-color:var(--ink);box-shadow:3px 3px 0 var(--hl)}
.lvn{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--accent);font-size:22px}
.who{border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--edge)}
/* 按鈕：實心原子筆藍 + 硬陰影，按下去會「壓」下去 */
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);border-radius:14px;box-shadow:var(--hard);transition:transform .08s ease,box-shadow .08s ease;filter:none}
.btn:hover{filter:none}
.btn:active{transform:translate(4px,4px) scale(1);box-shadow:0 0 0 var(--edge)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--edge)}
.btn.ghost:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--edge)}
.btn.small{border-radius:12px}
.chips{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);padding-right:24px}
.chips button{border:1.5px solid var(--line);background:var(--surface)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.small{-webkit-mask-image:none;mask-image:none;padding-right:0}
.icon{width:40px;height:40px;border:1.5px solid var(--line)}
.icon svg{width:17px;height:17px}
.icon.on{background:var(--hl);color:var(--note-ink);border-color:var(--edge)}
.icon.slowb{width:40px}
/* 今日進度：放在最上面的主角 */
.today{border:2px solid var(--edge);box-shadow:6px 6px 0 var(--edge);border-radius:20px;padding:20px;position:relative;overflow:visible}
.today::before{content:"";position:absolute;top:-11px;left:50%;width:74px;height:22px;transform:translateX(-50%) rotate(-2deg);background:color-mix(in srgb,var(--hl) 78%,transparent);border-radius:3px}
.ring{background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--chip) 0)}
.ring>div{background:var(--surface)}
.facts div b{font-size:24px}
.bar{height:6px}.bar i{background:var(--accent)}
.progress i{background:var(--accent)}
/* 每日一句：一張貼在牆上的便利貼 */
.daily{background:var(--note);color:var(--note-ink);border:1.5px solid color-mix(in srgb,var(--note-ink) 22%,transparent);border-radius:6px 6px 22px 6px;box-shadow:5px 6px 0 color-mix(in srgb,var(--edge) 16%,transparent);transform:rotate(-.6deg);padding:20px 20px 18px}
.daily::after{content:"";right:0;bottom:0;top:auto;width:26px;height:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--note-ink) 14%,var(--note)) 50%,var(--bg) 50%);border-radius:0 0 20px 0;font-size:0}
.daily .meta{font-weight:700;opacity:.8}
.daily .den{font-size:21px;line-height:1.5}

async function hash(pw,salt){
  const text=salt+"|"+pw;
  try{const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of text)h=(h*33+c.codePointAt(0))>>>0;return "d"+h.toString(16)}
}

function wordsOf(cat){
  if(cat==="mine")return U.custom.map(w=>({id:"mine:"+w.w,cat:"mine",w:w.w,ipa:w.ipa||"",pos:w.pos||"",zh:w.zh,ex:w.ex||"",exzh:w.exzh||"",forms:w.forms||"",colloc:COLLOC[w.w.toLowerCase()]||""}));
  return (B[cat]||[]).map(a=>({id:cat+":"+a[0],cat,w:a[0],ipa:a[1],pos:a[2],zh:a[3],ex:a[4],exzh:a[5]||"",forms:a[6]||"",colloc:COLLOC[a[0]]||""}));
}
function allWords(){return Object.keys(CATS).flatMap(wordsOf)}
function byId(id){return allWords().find(x=>x.id===id)}
function weakWords(){const all=allWords();return all.filter(x=>{const p=P(x.id);return (p.w||0)>0&&(p.b||0)<5}).sort((a,b)=>((P(b.id).w||0)-(P(a.id).w||0))||(P(a.id).d-P(b.id).d)).slice(0,WEAKMAX)}
function srcWords(src){if(src==="weak")return weakWords();if(src==="all"){const l=allWords().filter(x=>P(x.id).b>0);return l.length>=4?l:wordsOf(defaultSrc())}if(src==="nb"){const all=allWords();return Object.keys(U.nb).sort((a,b)=>U.nb[b]-U.nb[a]).map(id=>all.find(x=>x.id===id)).filter(Boolean)}return wordsOf(src)}
const WEAKMAX=40;
function weakCount(){let n=0;for(const k in U.prog){const p=U.prog[k];if(p&&(p.w||0)>0&&(p.b||0)<5)n++}return Math.min(n,WEAKMAX)}
function srcName(src){return src==="weak"?"常錯的字":src==="nb"?"我的筆記本":src==="all"?(tab==="quiz"?"學過的字":"全部到期"):CATS[src].name}
function P(id){return U.prog[id]||{b:0,d:0,w:0}}
function touchDay(){if(U.day.d!==today())U.day={d:today(),n:0,nw:0}}
function activity(){touchDay();U.day.n++;const t=today();U.hist=U.hist||{};U.hist[t]=(U.hist[t]||0)+1;if(U.streak.last!==t){U.streak.n=(U.streak.last===t-1)?U.streak.n+1:1;U.streak.last=t}}
function streak(){return U.streak.last>=today()-1?U.streak.n:0}
/* 新單字隨機抽：同一天、同一個人抽到的順序固定，隔天換一批 */
function dayShuffle(list){let h=2166136261;for(const c of (U.id+":"+today()))h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const rnd=()=>{h=Math.imul(h^(h>>>15),2246822507)>>>0;h=Math.imul(h^(h>>>13),3266489909)>>>0;h^=h>>>16;return (h>>>0)/4294967296};
  const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dueFor(src){
  const t=today();
  if(src==="all"){touchDay();
    const due=allWords().filter(x=>{const p=P(x.id);return p.b>0&&p.d<=t}).sort((a,b)=>P(a.id).d-P(b.id).d);
    const fresh=dayShuffle(wordsOf(defaultSrc()).filter(x=>P(x.id).b===0)).slice(0,Math.max(0,newQuota()-U.day.nw));
    return due.concat(fresh)}
  const list=srcWords(src);
  if(src==="nb"||src==="weak")return list;
  touchDay();
  const due=list.filter(x=>{const p=P(x.id);return p.b>0&&p.d<=t});
  const fresh=dayShuffle(list.filter(x=>P(x.id).b===0)).slice(0,Math.max(0,newQuota()-U.day.nw));
  return due.concat(fresh);
}

  if(w.endsWith("ied"))a(w.slice(0,-3)+"y");if(w.endsWith("ed")){a(w.slice(0,-1));a(w.slice(0,-2));if(/(.)\1ed$/.test(w))a(w.slice(0,-3))}
  if(w.endsWith("ing")){a(w.slice(0,-3)+"e");a(w.slice(0,-3));if(/(.)\1ing$/.test(w))a(w.slice(0,-4))}
  if(w.endsWith("ier"))a(w.slice(0,-3)+"y");if(w.endsWith("iest"))a(w.slice(0,-4)+"y");
  if(w.endsWith("er")){a(w.slice(0,-1));a(w.slice(0,-2))}if(w.endsWith("est")){a(w.slice(0,-2));a(w.slice(0,-3))}
  if(w.endsWith("ily"))a(w.slice(0,-3)+"y");if(w.endsWith("ly"))a(w.slice(0,-2));return c}

function bankMap(){if(BANKHOLD)return BANKHOLD;const all=allWords();if(BANKM&&BANKN===all.length)return BANKM;BANKM=new Map();
  for(const x of all){const k=String(x.w).toLowerCase();if(!BANKM.has(k)||x.cat!=="mine")BANKM.set(k,x)}BANKN=all.length;return BANKM}
function newsLook(it,raw){const w=raw.toLowerCase().replace(/’/g,"'").replace(/^[-']+|[-']+$/g,"");if(!w||NSTOP.has(w))return null;
  const cs=lemCands(w),bm=bankMap(),g=Object.assign({},NGL,it.gloss||{});
  for(const c of cs){const k=it.words.findIndex(x=>x[0].toLowerCase()===c);if(k>=0){const x=it.words[k];return{w:x[0],ipa:x[1],pos:x[2],zh:x[3],forms:x[4]||"",kw:k}}}
  for(const c of cs){if(bm.has(c)){const x=bm.get(c);return{w:x.w,ipa:x.ipa,pos:x.pos,zh:x.zh,forms:x.forms||"",id:x.id}}

function newsPara(en,words,it){if(!it){let h=esc(en);words.forEach((w,i)=>{h=h.replace(stemRe(w[0]),`<button class="kw" data-kw="${i}">$1</button>`)});return h}
  let out="",last=0,m;const re=/[A-Za-z][A-Za-z'’-]*[A-Za-z]|[A-Za-z]/g;
  while(m=re.exec(en)){const t=m[0];out+=esc(en.slice(last,m.index));last=m.index+t.length;
    const before=en.slice(0,m.index),start=!before.trim()||/[.!?:]["”’)]?\s+$|["“(]\s*$/.test(before);
    if(/^[A-Z]/.test(t)&&!start&&!words.some(x=>x[0].toLowerCase()===t.toLowerCase())){out+=esc(t);continue}
    const r=newsLook(it,t);
    if(!r){out+=esc(t);continue}
    out+=r.kw!=null?`<button class="kw" data-tw="${esc(t)}">${esc(t)}</button>`:`<button class="tw" data-tw="${esc(t)}">${esc(t)}</button>`}
  return out+esc(en.slice(last))}

/* ================= 翻卡 ================= */
function renderStudy(){
  closeSheet();
  if(!session||session.src!==studySrc){const q=dueFor(studySrc);session={src:studySrc,q:studySrc==="nb"||studySrc==="weak"?shuffle(q):q,total:q.length,done:0,flipped:false}}
  const s=session;
  let body;
  if(!s.q.length){
    const nb=s.src==="nb"&&!s.total,wk=s.src==="weak"&&!s.total;
    body=`${sessionSummary(s)}<div class="empty"><h2>${nb?"筆記本是空的":wk?"目前沒有常錯的字":s.total?"這組今天完成了":"今天沒有要複習的卡片"}</h2>
      <p>${nb?"翻卡時按星號、或測驗答錯的字，會自動收進筆記本。":wk?"翻卡按「不熟」或測驗答錯的字，會依錯的次數排在這裡，方便集中練習。":"明天到期的卡片會自動出現。可以換一組，或去做測驗。"}</p>
      ${nb||s.src==="weak"?"":forecastHtml(s.src)}${moreNewHtml(s.src)}<button class="btn" id="toQuiz">去測驗</button>${s.undo?`<button class="linkbtn undo" id="undo">↶ 按錯了？復原上一張</button>`:""}</div>`;
  }else{
    const x=s.q[0],p=P(x.id),rev=dirGet()==="zh"&&!s.flipped,exh=s.flipped&&x.ex?exHtml(x.ex,x.w,x.forms):"";
    body=`<div class="meta"><span>${s.src==="nb"?"筆記本練習":s.src==="weak"?`常錯字練習 · 錯過 ${p.w||0} 次`:p.b===0?"新單字":"複習"}</span><span>${s.done} / ${s.total}</span></div>
    <div class="progress"><i style="width:${s.total?s.done/s.total*100:0}%"></i></div>
    ${s.undo?`<button class="linkbtn undo" id="undo">↶ 按錯了？復原上一張（${esc(s.undo.w)}）</button>`:""}
    <div class="stage"><div class="card ${s.anim?"flipping":"flip"}" id="card" tabindex="0" role="button" aria-label="翻面">
      <span class="swipe-tag l" id="tagL">不熟</span><span class="swipe-tag r" id="tagR">記得</span>
      <div class="card-top"><span>${esc(CATS[x.cat].name)}</span>${dots(p.b)}</div>
      ${rev?`<div class="word zhw"><span class="pos">${esc(x.pos)}</span>${esc(x.zh)}</div>
      <div class="phon"><button class="icon ${inNb(x.id)?"on":""}" id="star" aria-label="加入筆記本">${ICON.star}</button></div>`
      :`<div class="word">${esc(x.w)}</div>
      <div class="phon"><span>${esc(x.ipa)}</span><button class="icon" id="spk" aria-label="發音">${ICON.spk}</button><button class="icon slowb" id="spkS" aria-label="慢速發音" title="慢慢念一次">慢</button>
        <button class="icon ${inNb(x.id)?"on":""}" id="star" aria-label="加入筆記本">${ICON.star}</button></div>`}
      ${s.flipped?`<div class="back"><div class="zh"><span class="pos">${esc(x.pos)}</span>${esc(x.zh)}</div>${x.ex?`<div class="exrow"><div class="ex">${exh}</div><button class="icon" id="exSay" aria-label="朗讀例句">${ICON.spk}</button></div>`:""}${x.exzh?`<div class="exzh">${esc(x.exzh)}</div>`:""}${/class="tw"/.test(exh)&&tapTipShow()?`<p class="tapnote">小提示：例句裡有虛線的字可以點，看意思、聽發音。</p>`:""}${formsHtml(x.forms)}${collocHtml(x.colloc)}</div>`:`<div class="hint">${rev?"先想想英文怎麼說，再點卡片看答案":"點卡片看中文意思"}</div>`}
    </div></div>
    ${s.flipped?`<div class="rate">
      <button class="r0" data-r="0">不熟<small>等一下再看</small></button>
      <button class="r1" data-r="1">模糊<small>明天複習</small></button>
      <button class="r2" data-r="2">記得<small>${INTERVAL[Math.min(MAXBOX,p.b+1)]} 天後</small></button></div>
    <div class="swipehint">也可以把卡片往左滑＝不熟、往右滑＝記得</div>`:""}
    ${p.b===0&&s.src!=="nb"?`<button class="linkbtn knew" id="knew">✓ 這個字我早就會了，跳過</button>`:""}`;
  }
  const dirH=`<div class="chips small" id="dirS" role="group" aria-label="翻卡方向">${[["en","看英文想中文"],["zh","看中文想英文"]].map(([k,v])=>`<button data-dir="${k}" aria-pressed="${dirGet()===k}">${v}</button>`).join("")}</div>`;
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${topbar("翻卡")}${srcChips(studySrc,"srcS")}${dirH}${body}</div>`;
  bindTop();
  $("#srcS").onclick=e=>{const b=e.target.closest("[data-src]");if(b){studySrc=b.dataset.src;session=null;renderStudy()}};
  $("#dirS").onclick=e=>{const b=e.target.closest("[data-dir]");if(!b||b.dataset.dir===dirGet())return;dirSet(b.dataset.dir);s.spoke=null;renderStudy();toast(b.dataset.dir==="zh"?"改成看中文、想英文":"改成看英文、想中文")};
  const ub=$("#undo");if(ub)ub.onclick=undoRate;
  const kb=$("#knew");if(kb)kb.onclick=knewIt;
  const mn=$("#moreNew");if(mn)mn.onclick=()=>{xnAdd(5);session=null;renderStudy();toast("今天多加 5 個新字")};
  const tq=$("#toQuiz");if(tq)tq.onclick=()=>{quizSrc=s.src==="nb"&&!Object.keys(U.nb).length?defaultSrc():s.src;quiz=null;go("quiz")};
  /* 翻卡小結裡的發音、加入筆記本 */
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  view.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const id=b.dataset.star;toggleNb(id);toast(inNb(id)?"已加入筆記本":"已從筆記本移除");const y=window.scrollY;renderStudy();window.scrollTo(0,y)});
  const card=$("#card");if(!card)return;
  const x=s.q[0];
  s.anim=false;
  const revMode=dirGet()==="zh";
  if(U.opt.auto&&!revMode&&!s.flipped&&s.spoke!==x.id){s.spoke=x.id;setTimeout(()=>say(x.w),150)}
  const flip=()=>{if(!s.flipped){s.flipped=true;s.anim=true;renderStudy();
    /* 翻面後：反向模式念單字；開了「自動念例句」就接著念例句 */
    const exOn=exaGet()&&x.ex;
    if(revMode&&(U.opt.auto||exOn))setTimeout(()=>say(exOn?x.w+". "+x.ex:x.w),150);
    else if(exOn)setTimeout(()=>say(x.ex),150)}};
  let x0=null,dx=0,moved=false;
  const tl=$("#tagL"),tr=$("#tagR");
  card.onpointerdown=e=>{if(!s.flipped||e.target.closest(".icon,.tw"))return;x0=e.clientX;dx=0;moved=false;card.classList.add("drag")};
  card.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8){moved=true;try{card.setPointerCapture(e.pointerId)}catch(_){}}
    card.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;tl.style.opacity=Math.min(1,Math.max(0,-dx/90));tr.style.opacity=Math.min(1,Math.max(0,dx/90))};
  const end=()=>{if(x0===null)return;x0=null;card.classList.remove("drag");
    if(Math.abs(dx)>90){card.style.transform=`translateX(${dx>0?600:-600}px) rotate(${dx>0?20:-20}deg)`;const r=dx>0?2:0;setTimeout(()=>rate(r),160)}
    else{card.style.transform="";tl.style.opacity=tr.style.opacity=0}};
  card.onpointerup=end;card.onpointercancel=end;
  card.onclick=e=>{if(e.target.closest(".icon,.tw")||moved){moved=false;return}flip()};
  bindTw(renderStudy);
  const es=$("#exSay");if(es)es.onclick=()=>say(x.ex);
  card.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
  const sp=$("#spk");if(sp)sp.onclick=()=>say(x.w);
  const sps=$("#spkS");if(sps)sps.onclick=()=>say(x.w,true);
  $("#star").onclick=()=>{toggleNb(x.id);toast(inNb(x.id)?"已加入筆記本":"已從筆記本移除");renderStudy()};
  view.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
}
/* 翻卡小結：這一輪每個字「第一次」按的是記得／模糊／不熟（只存在畫面上，不寫進使用者資料） */
function sessionSummary(s){const ids=Object.keys(s.res||{});if(!ids.length)return "";
  const c=[0,0,0];ids.forEach(id=>c[s.res[id]]++);
  const m=new Map(allWords().map(x=>[x.id,x]));
  const weak=ids.filter(id=>s.res[id]<2).sort((a,b)=>s.res[a]-s.res[b]).map(id=>m.get(id)).filter(Boolean);
  return `<section class="panel" aria-label="翻卡小結"><div class="sheader"><h2>這次翻卡小結</h2><span>共 ${ids.length} 個字</span></div>
    <div class="facts"><div><b style="color:var(--good)">${c[2]}</b><span>一次就記得</span></div><div><b style="color:var(--warn)">${c[1]}</b><span>模糊</span></div><div><b style="color:var(--bad)">${c[0]}</b><span>不熟</span></div></div>
    ${weak.length?`<p class="note" style="margin:0">這些字還不太熟，可以按喇叭再聽一次，或按星星加入筆記本。</p>
    <div class="list" style="background:var(--bg)">${weak.map(x=>`<div class="item"><div class="w">${esc(x.w)}<span>${esc(x.ipa)}</span></div><div class="z">${esc(x.pos)} ${esc(x.zh)}${s.res[x.id]===0?`<em>不熟</em>`:""}</div><div class="r"><button class="icon" data-say="${esc(x.w)}" aria-label="發音">${ICON.spk}</button>${starBtn(x.id)}</div></div>`).join("")}</div>`
    :`<p style="margin:0">每個字都一次就記得，太厲害了！</p>`}</section>`}
/* 復原上一張：評分前先記下這張卡原本的進度，按錯時可以還原（只還原原有欄位，不新增資料） */
function undoRate(){const s=session,u=s&&s.undo;if(!u)return;
  if(u.had)U.prog[u.id]=u.prev;else delete U.prog[u.id];
  U.day=u.day;U.streak=u.streak;U.hist=U.hist||{};if(u.hd===undefined)delete U.hist[u.t];else U.hist[u.t]=u.hd;
  s.q=u.q;s.done=u.done;s.res=u.res;s.flipped=true;s.anim=false;s.undo=null;save();renderStudy();toast("已復原，請重新選一次")}
function snapUndo(){const s0=session,y=s0.q[0],t0=today(),has=Object.prototype.hasOwnProperty.call(U.prog,y.id);
  s0.undo={w:y.w,id:y.id,had:has,prev:has?Object.assign({},U.prog[y.id]):null,day:Object.assign({},U.day),streak:Object.assign({},U.streak),t:t0,hd:U.hist?U.hist[t0]:undefined,q:s0.q.slice(),done:s0.done,res:Object.assign({},s0.res||{})}}
/* 新字「我早就會了」：直接放進熟練度 4 格（算已熟記），8 天後再出現確認一次；不佔用今天的新單字額度。
   只用原有的 prog 欄位 {b,d,w}，不新增使用者資料結構；按錯可以用「復原上一張」還原 */
function knewIt(){const s=session;if(!s||!s.q.length)return;const x=s.q[0];if(P(x.id).b!==0)return;
  snapUndo();s.q.shift();const t=today(),p={b:0,d:0,w:0,...P(x.id)};
  p.b=4;p.d=t+INTERVAL[4];U.prog[x.id]=p;s.done++;s.res=s.res||{};if(!(x.id in s.res))s.res[x.id]=2;
  touchDay();s.flipped=false;activity();save();renderStudy();toast("「"+x.w+"」已標成熟記，8 天後再確認一次（不佔今天的新字額度）")}
/* 今天的新字學完了，還想多學：顯示「再學 5 個新字」（這一組還有沒學過的字才出現） */
function moreNewHtml(src){if(src==="nb"||src==="weak")return "";touchDay();if(U.day.nw<newQuota())return "";
  const list=src==="all"?wordsOf(defaultSrc()):srcWords(src);const left=list.filter(x=>P(x.id).b===0).length;if(!left)return "";
  return `<div class="morenew"><button class="btn ghost" id="moreNew">還想學？再學 ${Math.min(5,left)} 個新字</button><p class="note" style="margin:0">今天的 ${newQuota()} 個新字已經學完，加碼只算今天</p></div>`}
/* 複習預告：這一組明天、未來 7 天各有多少張卡片到期（只讀進度，不寫入） */
function forecastHtml(src){const t=today();const list=src==="all"?allWords():srcWords(src);let d1=0,d7=0;
  for(const x of list){const p=U.prog[x.id];if(!p||!p.b)continue;if(p.d<=t+1)d1++;if(p.d<=t+7)d7++}
  if(!d7)return "";
  return `<div class="fcast" aria-label="複習預告"><div><b>${d1}</b><span>明天要複習</span></div><div><b>${d7}</b><span>未來 7 天</span></div></div>`}
function rate(r){
  snapUndo();
  const s=session,x=s.q.shift(),p={b:0,d:0,w:0,...P(x.id)},t=today();
  tdAdd(x.id);
  s.res=s.res||{};if(!(x.id in s.res))s.res[x.id]=r;
  touchDay();if(p.b===0&&s.src!=="nb"&&s.src!=="weak")U.day.nw++;
  if(r===0){p.b=1;p.d=t;p.w=(p.w||0)+1;s.q.splice(Math.min(3,s.q.length),0,x)}
  else if(r===1){p.b=Math.max(1,p.b);p.d=t+1;s.done++}
  else{p.b=Math.min(MAXBOX,p.b+1);p.d=t+INTERVAL[p.b];s.done++}
  U.prog[x.id]=p;s.flipped=false;activity();save();renderStudy();
}
document.addEventListener("keydown",e=>{if(!U||tab!=="study"||!session?.flipped)return;if(["1","2","3"].includes(e.key))rate(+e.key-1)});

/* ================= 測驗 ================= */
const QMODES={en:"看英文選中文",zh:"看中文選英文",cloze:"例句填空",confuse:"易混字",listen:"聽發音選中文",spell:"聽寫拼字"};
let CONF=null;
function starBtn(id){return id?`<button class="icon ${inNb(id)?"on":""}" data-star="${esc(id)}" aria-label="加入筆記本">${ICON.star}</button>`:""}
function wordId(w){const k=String(w).toLowerCase();const x=allWords().find(y=>String(y.w).toLowerCase()===k);return x?x.id:null}
function clozeOf(x){if(!x.ex)return null;
  const re=wordRe(x.w,x.forms);if(!re.test(x.ex))return null;return esc(x.ex).replace(re,'<span class="blank">?</span>')}
const norm=s=>s.toLowerCase().replace(/[^a-z'-]/g,"");
/* 拼字提示：只露出第一個字母和字數，例如 c _ _ _ _ */
function spellHint(w){return String(w).split(" ").map((p,j)=>[...p].map((c,i)=>i===0&&j===0?c:/[a-z]/i.test(c)?"_":c).join(" ")).join("   ")}
/* 選項干擾字：優先挑「同詞性」的字（例句填空、看中文選英文不會因為詞性不同就猜到答案），
   並避開英文或中文和正解一模一樣的字；同詞性的字不夠時，才用其他字補滿 3 個 */
/* 答錯時告訴使用者「你選的那個」是什麼意思，順便多認識一個字（只顯示，不寫入資料） */
function pickedNote(q,Q,m){if(m==="spell"||Q.picked===null||!q.opts)return "";const o=q.opts[Q.picked];if(!o||o.id===q.x.id)return "";
  return `<div class="picked"><span class="pk"><span class="flabel">你選的</span> <b>${esc(o.w)}</b> <span class="pos">${esc(o.pos)}</span>${esc(o.zh)}</span><button class="icon" data-say="${esc(o.w)}" aria-label="發音">${ICON.spk}</button></div>`}
const posKey=p=>String(p||"").split(/[./]/)[0].trim();
function makeOpts(x,pool,all){const k=posKey(x.pos),zh=String(x.zh).trim(),w=String(x.w).toLowerCase();
  const ok=y=>y.id!==x.id&&String(y.w).toLowerCase()!==w&&String(y.zh).trim()!==zh;
  let d=shuffle(pool.filter(ok));const pick=d.filter(y=>posKey(y.pos)===k).slice(0,3);
  for(const y of d){if(pick.length>=3)break;if(!pick.includes(y))pick.push(y)}
  if(pick.length<3)for(const y of shuffle(all.filter(ok))){if(pick.length>=3)break;if(!pick.includes(y))pick.push(y)}
  return shuffle([x,...pick])}
/* 只重測答錯的字：用同一個題型、同一個分類，只是題目換成剛才答錯的字（不動使用者資料結構） */
function retryWrong(){const Q=quiz;if(!Q||!Q.wrong.length||Q.mode==="confuse")return;
  const seen=new Set(),pool=Q.wrong.filter(x=>x&&x.id&&!seen.has(x.id)&&seen.add(x.id));if(!pool.length)return;
  const all=allWords(),base=srcWords(Q.src);
  const qs=shuffle(pool).map(x=>({x,opts:makeOpts(x,base,all)}));
  quiz={src:Q.src,mode:Q.mode,qs,i:0,score:0,picked:null,typed:"",wrong:[],retry:true};renderQuiz();window.scrollTo(0,0)}
function startQuiz(){
  if(qmode==="confuse"){
    if(!CONF||!CONF.length){quiz={src:quizSrc,mode:qmode,empty:true,loading:!CONF};return}
    const qs=shuffle(CONF).slice(0,10).map(g=>({g,q:g.q[Math.floor(Math.random()*g.q.length)],cf:true}));
    quiz={src:quizSrc,mode:qmode,qs,i:0,score:0,picked:null,typed:"",wrong:[]};return}
  let pool=srcWords(quizSrc);
  if(qmode==="cloze")pool=pool.filter(x=>clozeOf(x));
  if(!pool.length){quiz={src:quizSrc,mode:qmode,empty:true};return}
  const all=allWords();
  const qs=shuffle(pool).slice(0,10).map(x=>({x,opts:makeOpts(x,pool,all)}));
  quiz={src:quizSrc,mode:qmode,qs,i:0,score:0,picked:null,typed:"",wrong:[]};
}
function renderQuiz(){
  closeSheet();
  if(!quiz||quiz.src!==quizSrc||quiz.mode!==qmode)startQuiz();
  const Q=quiz,head=`${topbar("測驗")}${srcChips(quizSrc,"srcQ")}
    <div class="chips small" id="modeQ" role="group">${Object.entries(QMODES).map(([k,v])=>`<button data-m="${k}" aria-pressed="${k===qmode}">${v}</button>`).join("")}</div>`;
  let body;
  if(Q.empty&&Q.mode==="confuse"){body=`<div class="empty"><h2>${Q.loading?"易混字題庫載入中…":"題庫暫時讀不到"}</h2><p>稍等一下，或重新整理頁面。</p></div>`}
  else if(Q.empty){body=`<div class="empty"><h2>這裡還沒有單字</h2><p>${qmode==="cloze"?"這組單字沒有例句可以出填空題，換一個分類或題型試試。":quizSrc==="nb"?"把不會的字加進筆記本，就能專門測它們。":quizSrc==="weak"?"還沒有答錯或標「不熟」的字，先去翻卡或測驗吧。":"換一個分類試試。"}</p></div>`}
  else if(Q.i>=Q.qs.length){
    body=`<div class="qcard">
      <div class="meta"><span>測驗結果 · ${esc(QMODES[Q.mode])}${Q.retry?` <span class="qretry">重測答錯</span>`:""}</span><span>${esc(srcName(Q.src))}</span></div>
      <div class="score">${Q.score}<span style="font-size:24px;color:var(--muted)"> / ${Q.qs.length}</span></div>
      ${Q.wrong.length?`<p class="note" style="margin:0">${Q.mode==="confuse"?"答錯的字整理在下面，多比較幾次就不會搞混了。":"答錯的字已收進筆記本，明天也會排進複習。"}</p>
        <div class="list" style="background:var(--bg)">${Q.wrong.map(x=>`<div class="item"><div class="w">${esc(x.w)}<span>${esc(x.ipa)}</span></div><div class="z">${esc(x.pos)} ${esc(x.zh)}</div><div class="r"><button class="icon" data-say="${esc(x.w)}" aria-label="發音">${ICON.spk}</button>${starBtn(x.id)}</div></div>`).join("")}</div>`:`<p style="margin:0">全對，這組掌握得很好。</p>`}
      <div class="row2">${Q.wrong.length&&Q.mode!=="confuse"?`<button class="btn" id="retryW">重測錯的 ${new Set(Q.wrong.map(x=>x.id)).size} 個</button>`:""}<button class="btn${Q.wrong.length&&Q.mode!=="confuse"?" ghost":""}" id="again">${Q.retry?"換一組新題目":"再測一次"}</button>${Q.wrong.length&&Q.mode!=="confuse"?`<button class="btn ghost" id="toNb">翻卡複習答錯的字</button>`:""}</div></div>`;
  }else if(Q.mode==="confuse"){
    const q=Q.qs[Q.i],g=q.g,qq=q.q,answered=Q.picked!==null;
    const sent=esc(qq.s).replace("___",answered?`<mark>${esc(g.g[qq.a])}</mark>`:'<span class="blank">?</span>');
    body=`<div class="progress"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
      <div class="qcard"><div class="meta"><span>第 ${Q.i+1} / ${Q.qs.length} 題 · 易混字</span><span>答對 ${Q.score}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px"><div class="note">選出最適合填入空格的字</div><div class="cloze">${sent}</div>${answered?`<div class="exzh" style="margin:0">${esc(qq.z)}</div>`:""}</div>
      <div class="opts">${g.g.map((w,k)=>{let c="en";if(answered){if(k===qq.a)c+=" right";else if(k===Q.picked)c+=" wrong"}return `<button data-k="${k}" class="${c}" ${answered?"disabled":""}>${esc(w)}</button>`}).join("")}</div>
      ${answered?`<div class="snote"><b>分辨重點</b>${esc(g.tip)}</div>
        <div class="nvlist">${g.g.map((w,k)=>`<div class="nv"><div class="nvw"><b>${esc(w)}</b> <span class="nvz">${esc(g.m[k]||"")}</span></div><div class="nvr"><button class="icon" data-say="${esc(w)}" aria-label="發音">${ICON.spk}</button>${starBtn(wordId(w))}</div></div>`).join("")}</div>
        <button class="btn" id="next">${Q.i+1<Q.qs.length?"下一題":"看結果"}</button>`:""}</div>`;
  }else{
    const q=Q.qs[Q.i],m=Q.mode,answered=Q.picked!==null;
    let prompt,area;
    if(m==="en")prompt=`<div class="qword">${esc(q.x.w)}</div><button class="icon" id="qs" aria-label="發音">${ICON.spk}</button>`;
    else if(m==="cloze")prompt=`<div style="display:flex;flex-direction:column;gap:6px"><div class="note">選出空格裡的單字</div><div class="cloze">${answered?hl(q.x.ex,q.x.w,q.x.forms):clozeOf(q.x)}</div>${answered?"":`<div class="exzh" style="margin:0">${esc(q.x.exzh||"")}</div>`}</div>`;
    else if(m==="zh")prompt=`<div class="qword zhq"><span class="pos">${esc(q.x.pos)}</span>${esc(q.x.zh)}</div>`;
    else if(m==="listen")prompt=`<button class="btn" id="qs" style="display:flex;gap:8px;align-items:center">${ICON.spk.replace('<svg','<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"')}再聽一次</button>`;
    else prompt=`<div class="qword zhq"><span class="pos">${esc(q.x.pos)}</span>${esc(q.x.zh)}</div><button class="icon" id="qs" aria-label="聽發音">${ICON.spk}</button>`;
    if(m==="spell"){
      const ok=answered&&norm(Q.typed)===norm(q.x.w);
      area=`<form id="spF" style="display:grid;gap:10px">
        <input class="input spell ${answered?(ok?"right":"wrong"):""}" id="spIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="拼出這個英文單字" value="${esc(Q.typed)}" ${answered?"readonly":""}>
        ${answered?"":`<button class="btn" type="submit">確認</button>`}</form>
        ${answered?"":Q.hint?`<div class="hintw" aria-label="提示">${esc(spellHint(q.x.w))}</div>`:`<button class="linkbtn" id="spHint" type="button" style="align-self:center">想不起來？看提示（第一個字母）</button>`}
        ${answered&&!ok?`<div class="answer">正確拼法：<b>${esc(q.x.w)}</b></div>`:""}`;
    }else{
      const en=m==="zh"||m==="cloze";
      area=`<div class="opts">${q.opts.map((o,k)=>{let c=en?"en":"";if(answered){if(o.id===q.x.id)c+=" right";else if(k===Q.picked)c+=" wrong"}
        return `<button data-k="${k}" class="${c}" ${answered?"disabled":""}>${en?esc(o.w):`<span class="pos">${esc(o.pos)}</span>${esc(o.zh)}`}</button>`}).join("")}</div>`;
    }
    body=`<div class="progress"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
      <div class="qcard"><div class="meta"><span>第 ${Q.i+1} / ${Q.qs.length} 題</span><span>答對 ${Q.score}</span></div>
      <div class="qhead">${prompt}</div>${area}
      ${answered?`${pickedNote(q,Q,m)}${m!=="en"?`<div class="answer"><b>${esc(q.x.w)}</b> <span class="pos">${esc(q.x.pos)}</span>${esc(q.x.zh)}</div>`:""}${q.x.ex?`<div class="exrow"><div class="ex" style="line-height:1.5">${exHtml(q.x.ex,q.x.w,q.x.forms)}</div><button class="icon" id="qExSay" aria-label="朗讀例句">${ICON.spk}</button></div>`:""}${q.x.exzh?`<div class="exzh" style="margin-top:0">${esc(q.x.exzh)}</div>`:""}${formsHtml(q.x.forms)}${collocHtml(q.x.colloc)}
        <div class="dactions">${starBtn(q.x.id)}<span class="note">${inNb(q.x.id)?"已在筆記本（按星星可移除）":"按星星加入筆記本"}</span></div>
        <button class="btn" id="next">${Q.i+1<Q.qs.length?"下一題":"看結果"}</button>`:""}</div>`;
  }
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${head}${body}</div>`;
  bindTop();
  view.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{const id=b.dataset.star;toggleNb(id);toast(inNb(id)?"已加入筆記本":"已從筆記本移除");const y=window.scrollY;renderQuiz();window.scrollTo(0,y)});
  $("#srcQ").onclick=e=>{const b=e.target.closest("[data-src]");if(b){quizSrc=b.dataset.src;quiz=null;renderQuiz()}};
  $("#modeQ").onclick=e=>{const b=e.target.closest("[data-m]");if(b){qmode=b.dataset.m;quiz=null;renderQuiz()}};
  if(Q.empty)return;
  if(Q.i>=Q.qs.length){view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));$("#again").onclick=()=>{quiz=null;renderQuiz()};const rw=$("#retryW");if(rw)rw.onclick=retryWrong;const t=$("#toNb");if(t)t.onclick=()=>{studySrc="nb";session=null;go("study")};return}
  const q=Q.qs[Q.i];
  if(Q.mode==="confuse"){
    view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
    view.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(Q.picked!==null)return;const k=+b.dataset.k;Q.picked=k;activity();
      const a=q.q.a;if(k===a)Q.score++;else Q.wrong.push({w:q.g.g[a],ipa:"",pos:"",zh:q.g.m[a]||"",id:wordId(q.g.g[a])});save();say(q.q.s.replace("___",q.g.g[a]));renderQuiz()});
    const nx=$("#next");if(nx){nx.onclick=()=>{Q.i++;Q.picked=null;renderQuiz()};nx.focus()}
    return}
  const qs=$("#qs");if(qs)qs.onclick=()=>say(q.x.w);
  view.querySelectorAll(".picked [data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  const qe=$("#qExSay");if(qe)qe.onclick=()=>say(q.x.ex);
  bindTw(renderQuiz);
  if((Q.mode==="listen"||Q.mode==="spell")&&Q.picked===null&&!Q.spoke){Q.spoke=true;say(q.x.w)}
  const finish=ok=>{
    activity();tdAdd(q.x.id);
    const p={b:0,d:0,w:0,...P(q.x.id)};
    if(ok){Q.score++}else{Q.wrong.push(q.x);p.b=Math.max(1,Math.min(p.b,1));p.d=today()+1;p.w=(p.w||0)+1;U.nb[q.x.id]=U.nb[q.x.id]||Date.now()}
    U.prog[q.x.id]=p;save();
    if(Q.mode==="zh"||Q.mode==="cloze"||ok===false&&Q.mode!=="en")say(q.x.w);
    renderQuiz();
  };
  if(Q.mode==="spell"){
    const f=$("#spF");f.onsubmit=e=>{e.preventDefault();const v=$("#spIn").value;if(!v.trim()&&Q.picked===null)return;if(Q.picked!==null)return;Q.typed=v;Q.picked=0;finish(norm(v)===norm(q.x.w))};
    if(Q.picked===null)$("#spIn").focus();
    const hb=$("#spHint");if(hb)hb.onclick=()=>{Q.typed=$("#spIn").value;Q.hint=true;renderQuiz();const n=$("#spIn");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}};
  }else view.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{if(Q.picked!==null)return;const k=+b.dataset.k;Q.picked=k;finish(q.opts[k].id===q.x.id)});
  const nx=$("#next");if(nx){nx.onclick=()=>{Q.i++;Q.picked=null;Q.typed="";Q.spoke=false;Q.hint=false;renderQuiz()};nx.focus()}
}

/* ================= 筆記本 ================= */
/* 筆記本排序：只是畫面上的排列方式，不寫進使用者資料 */
const NBS={new:"最新加入",wrong:"錯最多次",az:"A–Z"};
function renderNb(){
  let ws=srcWords("nb");
  if(nbSort==="wrong")ws=ws.slice().sort((a,b)=>(P(b.id).w||0)-(P(a.id).w||0));
  else if(nbSort==="az")ws=ws.slice().sort((a,b)=>String(a.w).localeCompare(String(b.w)));
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${topbar("我的筆記本","收集你還不熟的字")}
    ${ws.length?`<div class="row2"><button class="btn" id="nbStudy">翻卡練習 ${ws.length} 個</button><button class="btn ghost" id="nbQuiz">用筆記本測驗</button></div>
    ${ws.length>1?`<div class="chips small" id="nbSort" role="group" aria-label="筆記本排序">${Object.entries(NBS).map(([k,v])=>`<button data-ns="${k}" aria-pressed="${k===nbSort}">${v}</button>`).join("")}</div>`:""}
    <div class="list">${ws.map(x=>{const p=P(x.id);return `<div class="item tap" data-id="${esc(x.id)}">
      <div class="w">${esc(x.w)}<span>${esc(x.ipa)}</span>${openWord===x.id?"":`<span class="more">詳細</span>`}</div>
      <div class="z">${esc(x.pos)} ${esc(x.zh)}${p.w?`<em>錯 ${p.w} 次</em>`:""}</div>
      <div class="r">${dots(p.b)}<button class="icon" data-say="${esc(x.w)}" aria-label="發音">${ICON.spk}</button><button class="del" data-rm="${esc(x.id)}">移除</button></div>${detailHtml(x)}</div>`}).join("")}</div>
    <p class="note">熟練度點滿 4 格以上，就可以考慮把它移出筆記本。</p>${(()=>{const k=ws.filter(x=>P(x.id).b>=4).length;return k?`<button class="btn ghost small nbclean" id="nbClean">一次移出已熟記的 ${k} 個字</button>`:""})()}`
    :`<div class="empty"><h2>筆記本是空的</h2><p>翻卡時按星號，或測驗答錯的字，會自動收進這裡。</p><button class="btn" id="nbGo">去翻卡</button></div>`}
  </div>`;
  bindTop();
  const g=$("#nbGo");if(g)g.onclick=()=>go("study");
  const ns=$("#nbSort");if(ns)ns.onclick=e=>{const b=e.target.closest("[data-ns]");if(b){nbSort=b.dataset.ns;renderNb()}};
  const s=$("#nbStudy");if(s)s.onclick=()=>{studySrc="nb";session=null;go("study")};
  const q=$("#nbQuiz");if(q)q.onclick=()=>{quizSrc="nb";quiz=null;go("quiz")};
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  view.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete U.nb[b.dataset.rm];save();renderNb();toast("已移除")});
  /* 一次移出已熟記（熟練度 4 格以上）的字：按兩下確認，只刪筆記本標記，學習進度不變 */
  const nc=$("#nbClean");if(nc)nc.onclick=()=>{const ids=ws.filter(x=>P(x.id).b>=4).map(x=>x.id);if(!nc.dataset.armed){nc.dataset.armed="1";nc.textContent=`再按一次：移出 ${ids.length} 個（進度會保留）`;setTimeout(()=>{if(nc.isConnected){nc.dataset.armed="";nc.textContent=`一次移出已熟記的 ${ids.length} 個字`}},3000);return}
    ids.forEach(id=>delete U.nb[id]);save();openWord=null;renderNb();toast(`已移出 ${ids.length} 個已熟記的字`)};
  bindDetail(renderNb);
}

/* ================= 單字庫 ================= */
function renderLib(){
  const cats=["all",...Object.keys(CATS).filter(k=>k!=="mine"||U.custom.length)];
  const q=libQ.toLowerCase();
  /* 依學習進度篩選：沒學過＝還沒翻過；學習中＝熟練度 1–3；已熟記＝4 以上（和首頁「已熟記」同一標準） */
  const LST={all:"全部進度",new:"沒學過",learning:"學習中",known:"已熟記"};
  const stOk=(x,k)=>{const b=P(x.id).b;return k==="all"||(k==="new"?b===0:k==="known"?b>=4:b>0&&b<4)};
  /* 也能用「變化形」找字：搜 caught 找到 catch、搜 crept 找到 creep、搜 ability 找到 able（比對型態變化欄位裡的英文字） */
  const FSTOP=new Set("adj adv prep conj pron sb sth the an of to in on at for with and or be do one's v-ing pp".split(" "));
  const fhit=x=>q.length>=2&&/^[a-z][a-z'-]*$/.test(q)&&!FSTOP.has(q)&&String(x.forms||"").toLowerCase().split(/[^a-z'-]+/).includes(q);
  const base=(libCat==="all"?allWords():wordsOf(libCat)).filter(x=>!q||x.w.toLowerCase().includes(q)||x.zh.includes(libQ)||fhit(x));
  /* 搜尋結果排序：完全相同的字最前面，其次是開頭相同、包含、變化形符合，最後才是中文符合 */
  if(q){const rk=x=>{const w=String(x.w).toLowerCase();return w===q?0:w.startsWith(q)?1:w.includes(q)?2:fhit(x)?2.5:x.zh.split(/[；;，,]/).some(z=>z.trim()===libQ)?3:4};
    base.sort((a,b)=>rk(a)-rk(b)||String(a.w).length-String(b.w).length)}
  const ws=base.filter(x=>stOk(x,libSt));
  view.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${topbar("單字庫",`共 ${allWords().length} 個單字`)}
    <div class="chips small" id="libC">${cats.map(k=>`<button data-c="${k}" aria-pressed="${k===libCat}">${k==="all"?"全部":esc(CATS[k].name)} <span style="opacity:.6;font-variant-numeric:tabular-nums">${k==="all"?allWords().length:wordsOf(k).length}</span></button>`).join("")}</div>
    <div class="chips small" id="libS" role="group" aria-label="依學習進度篩選">${Object.entries(LST).map(([k,v])=>`<button data-st="${k}" aria-pressed="${k===libSt}">${v} <span style="opacity:.6;font-variant-numeric:tabular-nums">${base.filter(x=>stOk(x,k)).length}</span></button>`).join("")}</div>
    ${libCat!=="all"&&wordsOf(libCat).length?`<div class="row2"><button class="btn small" id="libStudy">翻卡練習這一組</button><button class="btn ghost small" id="libQuiz">測驗這一組</button></div>`:""}
    <input class="input" id="libQ" placeholder="搜尋英文、中文或變化形（如 caught）" value="${esc(libQ)}" aria-label="搜尋單字">
    ${ws.length>0?`<p class="note" style="margin:0">${libQ?`找到 ${ws.length} 個`:`共 ${ws.length} 個`}${ws.length>libLimit?`，先顯示前 ${libLimit} 個`:""}</p>`:""}
    <div class="list">${ws.length?ws.slice(0,libLimit).map(x=>{const p=P(x.id);return `<div class="item tap" data-id="${esc(x.id)}">
      <div class="w">${esc(x.w)}<span>${esc(x.ipa)}</span>${libCat==="all"?`<span class="tag">${esc(CATS[x.cat].name)}</span>`:""}${q&&!x.w.toLowerCase().includes(q)&&!x.zh.includes(libQ)&&fhit(x)?`<span class="tag">變化形 ${esc(libQ)}</span>`:""}${openWord===x.id?"":`<span class="more">詳細</span>`}</div>
      <div class="z">${esc(x.pos)} ${esc(x.zh)}</div>
      <div class="r">${dots(p.b)}<button class="icon" data-say="${esc(x.w)}" aria-label="發音">${ICON.spk}</button>
        <button class="icon ${inNb(x.id)?"on":""}" data-star="${esc(x.id)}" aria-label="筆記本">${ICON.star}</button>
        ${x.cat==="mine"?`<button class="del" data-del="${esc(x.w)}">刪除</button>`:""}</div>${detailHtml(x)}</div>`}).join(""):`<div class="item"><div class="z">找不到符合的單字。</div></div>`}</div>
    ${ws.length>libLimit?`<button class="btn ghost" id="libMore">再顯示 ${Math.min(100,ws.length-libLimit)} 個</button>`:""}
    <details class="panel set" id="addD"><summary>新增自訂單字</summary><form class="setgrid" id="addF">
      <div class="row2"><label class="field">英文單字<input id="fw" required autocomplete="off" autocapitalize="off" placeholder="itinerary"></label>
        <label class="field">中文意思<input id="fz" required autocomplete="off" placeholder="行程表"></label></div>
      <div class="row2"><label class="field">詞性（選填）<input id="fp" autocomplete="off" placeholder="n."></label>
        <label class="field">音標（選填）<input id="fi" autocomplete="off" placeholder="/aɪˈtɪnəreri/"></label></div>
      <label class="field">例句（選填）<input id="fe" autocomplete="off" placeholder="I'll send you the itinerary tonight."></label>
      <button class="btn" type="submit">加入</button></form></details>
    <details class="panel set"><summary>一次貼上很多單字</summary><div class="setgrid">
      <p class="note" style="margin:0">一行一個，格式：英文, 中文。也可以加詞性和例句：英文, 詞性, 中文, 例句。可以直接從 Excel 複製（用 Tab 分隔也行）。</p>
      <label class="field">單字清單<textarea id="bulk" placeholder="itinerary, 行程表&#10;souvenir, n., 紀念品, I bought a souvenir for my sister."></textarea></label>
      <button class="btn" id="bulkGo">全部加入</button></div></details>
  </div>`;
  bindTop();
  $("#libC").onclick=e=>{const b=e.target.closest("[data-c]");if(b){libCat=b.dataset.c;libLimit=100;renderLib()}};
  $("#libS").onclick=e=>{const b=e.target.closest("[data-st]");if(b){libSt=b.dataset.st;libLimit=100;renderLib()}};
  /* 從單字庫直接練這一組 */
  const lsb=$("#libStudy");if(lsb)lsb.onclick=()=>{studySrc=libCat;session=null;go("study")};
  const lqb=$("#libQuiz");if(lqb)lqb.onclick=()=>{quizSrc=libCat;quiz=null;go("quiz")};
  const lm=$("#libMore");if(lm)lm.onclick=()=>{const y=window.scrollY;libLimit+=100;renderLib();window.scrollTo(0,y)};
  const inp=$("#libQ");inp.oninput=()=>{libQ=inp.value.trim();libLimit=100;const pos=inp.selectionStart;renderLib();const n=$("#libQ");n.focus();n.setSelectionRange(pos,pos)};
  view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  view.querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{toggleNb(b.dataset.star);toast(inNb(b.dataset.star)?"已加入筆記本":"已從筆記本移除");const y=window.scrollY;renderLib();window.scrollTo(0,y)});
  bindDetail(renderLib);
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{U.custom=U.custom.filter(w=>w.w!==b.dataset.del);delete U.prog["mine:"+b.dataset.del];delete U.nb["mine:"+b.dataset.del];save();session=quiz=null;renderLib();toast("已刪除")});
  const add=w=>{if(!w.w||!w.zh)return false;if(U.custom.some(x=>x.w.toLowerCase()===w.w.toLowerCase()))return false;U.custom.push(w);return true};
  $("#addF").onsubmit=e=>{e.preventDefault();
    const ok=add({w:$("#fw").value.trim(),zh:$("#fz").value.trim(),pos:$("#fp").value.trim(),ipa:$("#fi").value.trim(),ex:$("#fe").value.trim()});
    if(!ok){toast("這個單字已經在自訂清單裡");return}
    save();session=quiz=null;libCat="mine";renderLib();$("#addD").open=true;$("#fw").focus();toast("已加入「自訂單字」")};
  $("#bulkGo").onclick=()=>{
    let n=0,skip=0;
    for(const line of $("#bulk").value.split(/\r?\n/)){
      const c=line.split(/\t|,|，/).map(s=>s.trim());if(c.length<2||!c[0])continue;
      const w=c.length>=4?{w:c[0],pos:c[1],zh:c[2],ex:c.slice(3).join(", "),ipa:""}:c.length===3?{w:c[0],pos:c[1],zh:c[2],ex:"",ipa:""}:{w:c[0],zh:c[1],pos:"",ex:"",ipa:""};
      if(add(w))n++;else skip++;
    }
    if(!n){toast(skip?"這些單字都已經加過了":"沒有讀到單字，請用「英文, 中文」的格式");return}
    save();session=quiz=null;libCat="mine";renderLib();toast(`加入 ${n} 個${skip?`，略過 ${skip} 個重複`:""}`)};
}

render();
/* 載入額外的單字資料檔，重複的字自動略過 */
(async function loadShards(){if(!SHARDS.length)return;let added=0;
  const have=new Set(Object.values(B).flat().map(w=>String(w[0]).toLowerCase()));
  for(const f of SHARDS){try{const r=await fetch(f,{cache:"no-cache"});if(!r.ok)continue;const d=await r.json();
    for(const cat in d){if(cat==="COLLOC"){for(const k in d.COLLOC)if(!COLLOC[k])COLLOC[k]=d.COLLOC[k];continue}
      if(!B[cat]||!CATS[cat])continue;
      for(const w of d[cat]){if(!Array.isArray(w)||w.length!==7||!w[0])continue;const key=String(w[0]).toLowerCase();if(have.has(key))continue;have.add(key);B[cat].push(w);added++}}
  }catch(e){}}
  /* 依大考中心官方級數校正學測 1–6 級分類，並把進度/筆記本搬到新分類 */
  let moved=0;
  try{const r=await fetch("words/ceec-levels.json",{cache:"no-cache"});if(r.ok){const L=(await r.json()).L||{};const ren={};
    for(let n=1;n<=6;n++){const c="gsat"+n;if(!B[c])continue;
      B[c]=B[c].filter(w=>{const e=L[String(w[0]).toLowerCase()],lv=e&&e[0];if(!lv||lv===n||!B["gsat"+lv]||!CATS["gsat"+lv])return true;
        const t="gsat"+lv,lw=String(w[0]).toLowerCase();if(!B[t].some(x=>String(x[0]).toLowerCase()===lw))B[t].push(w);
        ren[c+":"+w[0]]=t+":"+w[0];moved++;return false})}
    if(moved){let ch=false;for(const u of DB.users)for(const f of ["prog","nb"]){const o=u[f];if(!o)continue;
      for(const k in ren)if(k in o){if(!(ren[k] in o))o[ren[k]]=o[k];delete o[k];ch=true}}
      if(ch)save()}
  }}catch(e){}
  try{const r=await fetch("words/news-gloss.json",{cache:"no-cache"});if(r.ok){NGL=(await r.json()).L||{};if(U&&tab==="news"&&newsSel)render()}}catch(e){}
  try{const r=await fetch("words/news-archive.json",{cache:"no-cache"});if(r.ok){NSRV=(await r.json()).days||{};if(U&&tab==="news"&&!newsSel)render()}}catch(e){}
  try{const r=await fetch("words/confuse.json",{cache:"no-cache"});CONF=r.ok?((await r.json()).groups||[]).filter(g=>Array.isArray(g.g)&&Array.isArray(g.q)&&g.q.length):[]}catch(e){CONF=[]}
  if(quiz&&quiz.mode==="confuse"&&quiz.empty){quiz=null;if(U&&tab==="quiz")render()}
  if((added||moved)&&U&&(tab==="home"||tab==="lib"))render();
})();
</script>
</body>
</html>
